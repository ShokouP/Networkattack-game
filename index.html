<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>光速城 · Lightspeed Grid</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0c0f; display:flex; justify-content:center; align-items:center;
    min-height:100vh; min-height:100dvh; overflow:hidden; font-family:'Share Tech Mono',monospace;
  }
  #app {
    width:min(1200px, 100vw); height:min(800px, 100dvh);
    max-width:1200px;
    background:#0d1117;
    border:2px solid #1a3a2a; border-radius:6px; position:relative;
    box-shadow:0 0 40px rgba(0,255,100,0.06), inset 0 0 80px rgba(0,0,0,0.5);
    display:flex; flex-direction:column; user-select:none;
  }
  /* ── Mobile portrait (narrow) ── */
  @media (max-width: 700px) and (orientation: portrait) {
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #app { height: 100dvh; max-height: none; border: none; border-radius: 0; }
    #game-area { display: flex; flex-direction: column; min-height: 0; }
    #hud { padding: 3px 5px; gap: 3px; min-height: 34px; }
    #hud .hud-label { display: none; }
    .hud-value { font-size: 14px !important; }
    .hud-row { gap: 4px; }
    .hud-item { gap: 1px; }
    .power-bar, .core-bar { width: 44px; height: 5px; }
    .core-bars { gap: 3px; }
    .mini-core-bar { width: 14px; height: 4px; }
    #ai-threat { max-width: 80px; font-size: 9px; margin-top: 1px; }
    #tip-bar { min-height: 20px; padding: 3px 8px; }
    #tip-text { font-size: 9px; }
    #canvas-wrap { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #050705; }
    canvas { width: 100%; height: auto; max-width: 100%; max-height: 100%; aspect-ratio: 1200 / 641; object-fit: contain; min-width: auto; }
    #card-hand { min-height: 104px; max-height: 132px; padding: 5px 8px; justify-content: flex-start; }
    .card { width: 100px !important; height: 90px !important; margin: 0 3px; }
    .card-inner { grid-template-columns: 30px 1fr !important; grid-template-rows: 16px 1fr 16px !important; padding: 4px 5px 4px 4px !important; }
    .card-pixel { width: 28px !important; height: 80px !important; }
    .card-pixel canvas { width: 24px !important; height: 74px !important; }
    .card-name { font-size: 11px !important; max-width: 60px !important; }
    .card-cost { font-size: 13px !important; min-width: 14px !important; }
    .card-desc { font-size: 7px !important; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-stats { font-size: 7px !important; gap: 4px !important; margin-top: 2px !important; }
    .card-tag { font-size: 7px !important; padding: 1px 3px !important; }
    #overlay { gap: 12px; padding: 22px; }
    #overlay h1 { font-size: 26px; letter-spacing: 2px; }
    #overlay p { font-size: 13px; margin-bottom: 5px; }
    #overlay button { padding: 12px 18px; font-size: 15px; letter-spacing: 1px; width: min(280px, 82vw); }
    #overlay div { gap: 10px; }
    #intro { padding: 28px; padding-top: calc(28px + env(safe-area-inset-top)); }
    #intro-line { font-size: 14px; line-height: 1.55; }
    #intro-skip { font-size: 10px; bottom: calc(14px + env(safe-area-inset-bottom)); right: calc(18px + env(safe-area-inset-right)); }
  }
  @media (max-width: 380px) and (orientation: portrait) {
    .hud-value { font-size: 12px !important; }
    .power-bar, .core-bar { width: 34px; height: 4px; }
    .mini-core-bar { width: 10px; height: 3px; }
    #ai-threat { display: none; }
    #card-hand { min-height: 88px; max-height: 108px; }
    .card { width: 84px !important; height: 76px !important; }
    .card-inner { grid-template-columns: 26px 1fr !important; grid-template-rows: 14px 1fr 14px !important; }
    .card-pixel { width: 24px !important; height: 68px !important; }
    .card-pixel canvas { width: 20px !important; height: 62px !important; }
    .card-name { font-size: 10px !important; max-width: 50px !important; }
    .card-cost { font-size: 11px !important; }
    .card-desc { font-size: 6px !important; }
    .card-stats { font-size: 6px !important; }
    .card-tag { font-size: 6px !important; }
  }
  /* ── Mobile landscape (wide) ── */
  @media (max-width: 900px) and (orientation: landscape) {
    body { align-items: stretch; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #app { height: 100dvh; max-height: none; border: none; border-radius: 0; }
    #game-area { flex: 1; display: flex; flex-direction: row; min-height: 0; }
    #hud { padding: 3px 10px; gap: 5px; min-height: 34px; }
    #hud .hud-label { font-size: 8px; }
    .hud-value { font-size: 13px !important; }
    .hud-row { gap: 4px; }
    .power-bar, .core-bar { width: 48px; height: 4px; }
    .mini-core-bar { width: 12px; height: 3px; }
    #ai-threat { max-width: 110px; font-size: 8px; margin-top: 0; }
    #tip-bar { min-height: 14px; padding: 2px 8px; }
    #tip-text { font-size: 8px; }
    #canvas-wrap { flex: 1 1 auto; align-self: stretch; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; background: #050705; }
    canvas { width: 100%; height: auto; max-height: 100%; aspect-ratio: 1200 / 641; object-fit: contain; min-width: auto; }
    #card-hand { flex: 0 0 118px; align-self: stretch; width: 118px; min-width: 118px; padding: 3px; }
    .card { width: 106px !important; height: 56px !important; margin: 2px 0; }
    .card-inner { grid-template-columns: 24px 1fr !important; grid-template-rows: 12px 1fr 12px !important; padding: 2px 4px 2px 2px !important; }
    .card-pixel { width: 22px !important; height: 48px !important; }
    .card-pixel canvas { width: 18px !important; height: 44px !important; }
    .card-name { font-size: 9px !important; max-width: 72px !important; }
    .card-cost { font-size: 10px !important; }
    .card-stats { font-size: 6px !important; gap: 4px !important; margin-top: 1px !important; }
    .card-tag { font-size: 6px !important; padding: 1px 2px !important; }
    #overlay { gap: 10px; padding: 14px; }
    #overlay h1 { font-size: 22px; letter-spacing: 2px; }
    #overlay p { font-size: 10px; margin-bottom: 3px; }
    #overlay button { padding: 8px 12px; font-size: 12px; letter-spacing: 1px; width: min(240px, 62vw); }
    #intro { padding: 22px; padding-top: calc(22px + env(safe-area-inset-top)); }
    #intro-line { font-size: 11px; line-height: 1.45; }
    #intro-skip { font-size: 9px; bottom: calc(12px + env(safe-area-inset-bottom)); right: calc(14px + env(safe-area-inset-right)); }
  }
  #hud {
    min-height:52px; display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; border-bottom:1px solid #1a3a2a;
    background:linear-gradient(180deg, rgba(10,16,12,0.92) 0%, rgba(5,8,6,0.85) 100%); font-size:clamp(11px,2.8vw,14px); color:#7eb896;
    gap:10px;
  }
  .hud-item { display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
  .hud-item.right { align-items:flex-end; }
  .hud-row { display:flex; align-items:center; gap:clamp(3px,1vw,7px); }
  .hud-label { color:#4a6b5a; font-size:clamp(8px,1.8vw,11px); text-transform:uppercase; letter-spacing:0.5px; }
  .hud-value { color:#3cf58b; font-size:clamp(14px,3.6vw,19px); font-weight:bold; text-shadow:0 0 12px rgba(60,245,139,0.18); }
  .hud-value.danger { color:#f53c3c; animation:pulse 0.6s infinite; text-shadow:0 0 14px rgba(245,60,60,0.35); }
  #time-display.danger { color:#f53c3c; animation:pulse 0.6s infinite; text-shadow:0 0 14px rgba(245,60,60,0.35); }
  .power-bar, .core-bar { width:clamp(44px,11vw,74px); height:5px; background:#0f1812; border-radius:3px; overflow:hidden; border:1px solid #1a2e20; position:relative; }
  .power-bar::after, .core-bar::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,0.12), transparent 50%); pointer-events:none; }
  .power-bar-inner { height:100%; background:linear-gradient(90deg,#3cf58b,#2ad46e); transition:width 0.15s; box-shadow:0 0 8px rgba(60,245,139,0.25); }
  .core-bar-inner { height:100%; background:linear-gradient(90deg,#3cf58b,#2ad46e); transition:width 0.15s; box-shadow:0 0 8px rgba(60,245,139,0.2); }
  .core-bars { display:flex; gap:3px; margin-top:1px; }
  .mini-core-bar { width:clamp(14px,3.5vw,22px); height:4px; background:#0f1812; border-radius:2px; overflow:hidden; border:1px solid #1a2e20; }
  .mini-core-inner { height:100%; background:linear-gradient(90deg,#3cf58b,#2ad46e); transition:width 0.15s; }
  .mini-core-inner.danger { background:linear-gradient(90deg,#f53c3c,#c02020); box-shadow:0 0 6px rgba(245,60,60,0.35); }
  @keyframes pulse { 50% { opacity:0.45; } }
  #ai-threat { margin-top:2px; font-size:clamp(7px,1.8vw,9px); color:#c08080; max-width:100px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #canvas-wrap { flex:1; position:relative; overflow:hidden; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  /* ── Card Hand ── */
  #card-hand {
    height: auto; min-height: 112px; max-height: 148px;
    display: flex; align-items: center; justify-content: center; gap: 0;
    padding: 9px 12px; border-top: 1px solid #1a3a2a;
    background: linear-gradient(0deg, rgba(5,8,6,0.95) 0%, rgba(10,16,12,0.88) 100%);
    overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: #1a3a2a #0a0c0f;
  }
  #card-hand::-webkit-scrollbar { height: 5px; }
  #card-hand::-webkit-scrollbar-track { background: #0a0c0f; }
  #card-hand::-webkit-scrollbar-thumb { background: #1a3a2a; border-radius: 3px; }
  .card {
    width: clamp(124px, 19vw, 168px); height: clamp(96px, 17vw, 122px);
    background: linear-gradient(180deg, #0f1812 0%, #0a110d 100%);
    border: 2px solid #1f3328; border-radius: 4px;
    cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0;
    transition: all 0.15s cubic-bezier(0.25,0.46,0.45,0.94); margin: 0 5px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 4px 10px rgba(0,0,0,0.35);
    image-rendering: pixelated;
    touch-action: manipulation;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--card-accent, #3cf58b);
    box-shadow: 0 0 10px var(--card-accent, #3cf58b);
  }
  .card::after {
    content: ''; position: absolute; top: 3px; left: 0; right: 0; height: 40%;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
    pointer-events: none;
  }
  .card:hover {
    border-color: var(--card-accent, #3cf58b);
    transform: translateY(-6px);
    box-shadow: 0 0 0 1px var(--card-accent, #3cf58b), 0 12px 28px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .card.selected {
    border-color: var(--card-accent, #3cf58b);
    transform: translateY(-10px);
    box-shadow: 0 0 0 2px var(--card-accent, #3cf58b), 0 16px 36px rgba(0,0,0,0.65), 0 0 24px var(--card-accent,#3cf58b)33;
  }
  .card.unaffordable { opacity: 0.28; pointer-events: none; filter: grayscale(0.85) brightness(0.8); }
  .card.used-up { opacity: 0.24; pointer-events: none; filter: grayscale(1) brightness(0.65); }
  .card.used-up::after {
    content: '已耗尽';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #f53c3c; font-size: clamp(10px, 2.4vw, 13px); font-weight: bold; letter-spacing: 2px;
  }
  .card-inner {
    display: grid;
    grid-template-columns: clamp(40px, 8vw, 50px) 1fr;
    grid-template-rows: clamp(18px, 4vw, 22px) 1fr clamp(18px, 4vw, 22px);
    height: 100%; padding: 6px 8px 6px 6px; position: relative; z-index: 1;
  }
  .card-pixel {
    grid-row: 1 / 4; width: clamp(36px, 7vw, 44px); height: clamp(84px, 15vw, 104px);
    background: #0a0f0c; border: 1px solid #1f3326; border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
  }
  .card-pixel canvas { width: clamp(32px, 6vw, 38px); height: clamp(74px, 13vw, 96px); image-rendering: pixelated; }
  .card-header { grid-column: 2; display: flex; justify-content: space-between; align-items: center; }
  .card-name { font-size: clamp(10px, 2.6vw, 13px); font-weight: bold; color: #e8f0e8; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: clamp(62px, 14vw, 90px); }
  .card-cost {
    font-size: clamp(12px, 3.2vw, 15px); font-weight: bold; color: var(--card-accent, #3cf58b); line-height: 1;
    min-width: 18px; text-align: right;
  }
  .card-body { grid-column: 2; display: flex; flex-direction: column; gap: 3px; padding-top: 2px; }
  .card-desc { font-size: clamp(7px, 1.8vw, 9px); color: #8aa898; line-height: 1.4; }
  .card-stats { display: flex; gap: clamp(5px, 1.5vw, 9px); margin-top: auto; font-size: clamp(7px, 1.8vw, 9px); color: #5a7a6a; }
  .card-stat { display: flex; align-items: center; gap: 2px; }
  .card-stat-val { color: #a8c8b2; font-weight: bold; }
  .card-footer { grid-column: 2; display: flex; justify-content: space-between; align-items: center; }
  .card-tag {
    font-size: clamp(6px, 1.6vw, 8px); padding: 1px 5px; letter-spacing: 0.5px; text-transform: uppercase;
    background: rgba(0,0,0,0.45); color: var(--card-accent, #3cf58b); border: 1px solid rgba(255,255,255,0.12); border-radius: 2px;
  }
.card-tag.flying { color: #d4b830; border-color: rgba(212,184,48,0.35); }
.card-tag.spell { color: #b880f0; border-color: rgba(184,128,240,0.35); }
.card-tag.building { color: #68a8e0; border-color: rgba(104,168,224,0.3); }
.card-tag.ground { color: #e08850; border-color: rgba(224,136,80,0.3); }
.card-cost-orb {
  position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25), rgba(0,0,0,0.4) 60%);
  border:1px solid var(--card-accent,#3cf58b); display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:bold; color:#e8f0e8; box-shadow:0 0 8px var(--card-accent,#3cf58b)33;
}
.card-rarity-glow { position:absolute; inset:0; pointer-events:none; opacity:0.08; background:var(--card-accent,#3cf58b); }
  #tooltip {
    position:absolute; pointer-events:none; z-index:10;
    background:rgba(5,10,8,0.96); border:1px solid var(--card-accent,#2a4a3a);
    border-radius:6px; padding:12px 16px; font-size:12px; color:#b8d4c3;
    max-width:260px; display:none; box-shadow:0 8px 24px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
    backdrop-filter:blur(4px);
  }
  #tooltip b { color:#e8f0e8; letter-spacing:0.5px; }
  #message {
    position:absolute; top:46%; left:50%; transform:translate(-50%,-50%);
    pointer-events:none; z-index:20;
    font-size:clamp(18px,4vw,26px); color:#3cf58b; text-shadow:0 0 24px rgba(60,245,139,0.55), 0 2px 8px rgba(0,0,0,0.8);
    display:none; text-align:center; line-height:1.5; letter-spacing:1px;
    background:rgba(0,0,0,0.42); padding:14px 26px; border:1px solid rgba(60,245,139,0.35); border-radius:4px;
    backdrop-filter:blur(3px);
  }
  #message.danger { color:#f53c3c; border-color:rgba(245,60,60,0.4); text-shadow:0 0 24px rgba(245,60,60,0.55), 0 2px 8px rgba(0,0,0,0.8); }
  #message.warn { color:#f0c030; border-color:rgba(240,192,48,0.4); text-shadow:0 0 24px rgba(240,192,48,0.55), 0 2px 8px rgba(0,0,0,0.8); }
  #overlay {
    position:absolute; inset:0; z-index:15;
    background:radial-gradient(circle at 50% 35%, rgba(10,24,16,0.88) 0%, rgba(0,0,0,0.82) 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:24px; text-align:center;
  }
  #overlay h1 { font-size:clamp(28px, 6.5vw, 40px); color:#3cf58b; letter-spacing:5px; text-shadow:0 0 40px rgba(60,245,139,0.45); }
  #overlay p { color:#8ab89a; font-size:clamp(12px, 3vw, 15px); max-width:min(520px, 90vw); text-align:center; line-height:1.7; }
  #overlay div { flex-wrap:wrap; justify-content:center; }
  #overlay button, .start-btn {
    background:transparent; border:2px solid #3cf58b; color:#3cf58b;
    padding:clamp(10px, 3vw, 14px) clamp(28px, 10vw, 44px); font-size:clamp(14px, 4vw, 17px); font-family:inherit; cursor:pointer;
    letter-spacing:2px; border-radius:4px; transition:all 0.2s;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 4px 14px rgba(0,0,0,0.35);
  }
  #overlay button:hover, .start-btn:hover {
    background:rgba(60,245,139,0.1); box-shadow:0 0 0 1px #3cf58b, 0 8px 24px rgba(60,245,139,0.2);
    transform:translateY(-2px);
  }
  .end-card {
    background:rgba(0,0,0,0.35); border:1px solid #1a3a2a; border-radius:6px;
    padding:18px 24px; max-width:min(520px,90vw); text-align:center;
    box-shadow:0 8px 28px rgba(0,0,0,0.35);
  }
  .end-card h2 { font-size:clamp(22px,5vw,30px); letter-spacing:3px; margin-bottom:10px; }
  .end-card .end-msg { color:#b8d4c3; font-size:clamp(12px,3vw,14px); line-height:1.7; white-space:pre-line; }
  .end-card .end-advice { color:#7eb896; font-size:12px; line-height:1.6; margin-top:10px; }
  .end-card .end-score { color:#3cf58b; font-size:13px; margin-top:12px; min-height:18px; }
  #tip-bar {
    min-height:24px; display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid #1a3a2a; background:rgba(0,0,0,0.35); padding:4px 12px;
  }
  #tip-text { font-size:clamp(9px, 2.2vw, 12px); color:#4a7a5a; text-align:center; letter-spacing:0.5px; }
  #tip-text.active { color:#3cf58b; text-shadow:0 0 10px rgba(60,245,139,0.35); }
  #tip-text.warn { color:#f0c030; text-shadow:0 0 10px rgba(240,192,48,0.35); }
  #intro {
    position:absolute; inset:0; z-index:20; background:#050705;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start;
    padding:44px; font-family:'Share Tech Mono',monospace; color:#3cf58b;
    overflow:hidden; cursor:pointer; touch-action: manipulation;
  }
  #intro-line { font-size:clamp(14px,3vw,17px); line-height:1.65; white-space:pre-wrap; text-shadow:0 0 8px rgba(60,245,139,0.35); }
  #intro-cursor { display:inline-block; width:8px; height:1em; background:#3cf58b; animation:blink 0.8s infinite; vertical-align:middle; }
  @keyframes blink { 50% { opacity:0; } }
  #intro-skip { position:absolute; bottom:22px; right:26px; color:#4a7a5a; font-size:12px; letter-spacing:1px; }
  #overlay { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-item">
      <div class="hud-row"><span class="hud-label">算力</span><span class="hud-value" id="power-display">5/10</span></div>
      <div class="power-bar"><div class="power-bar-inner" id="power-bar" style="width:50%"></div></div>
    </div>
    <div class="hud-item">
      <div class="hud-row"><span class="hud-label">核心服务器</span><span class="hud-value" id="core-display">5000</span></div>
      <div class="core-bars">
        <div class="mini-core-bar"><div class="mini-core-inner" id="core-bar-0" style="width:100%"></div></div>
        <div class="mini-core-bar"><div class="mini-core-inner" id="core-bar-1" style="width:100%"></div></div>
        <div class="mini-core-bar"><div class="mini-core-inner" id="core-bar-2" style="width:100%"></div></div>
      </div>
    </div>

// ── Account API layer ──
const API_BASE='';
let currentAccount=null;
function getToken(){return localStorage.getItem('lg_token');}
function setToken(t){if(t)localStorage.setItem('lg_token',t);else localStorage.removeItem('lg_token');}
async function apiPost(path,body){
  const opts={method:'POST',headers:{'Content-Type':'application/json'}};
  const token=getToken();if(token)opts.headers['Authorization']='Bearer '+token;
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API_BASE+path,opts);
  const data=await r.json().catch(()=>({}));
  if(!r.ok){const err=new Error(data.error||'Request failed');err.status=r.status;throw err;}
  return data;
}
async function apiGet(path){
  const opts={method:'GET',headers:{}};
  const token=getToken();if(token)opts.headers['Authorization']='Bearer '+token;
  const r=await fetch(API_BASE+path,opts);
  const data=await r.json().catch(()=>({}));
  if(!r.ok){const err=new Error(data.error||'Request failed');err.status=r.status;throw err;}
  return data;
}
async function registerAccount(username,password){
  const data=await apiPost('/api/auth/register',{username,password});
  setToken(data.token);currentAccount=data.account;
  updateAccountBar();return data.account;
}
async function loginAccount(username,password){
  const data=await apiPost('/api/auth/login',{username,password});
  setToken(data.token);currentAccount=data.account;
  updateAccountBar();return data.account;
}
async function loadAccount(){
  const token=getToken();if(!token){currentAccount=null;updateAccountBar();return null;}
  try{
    currentAccount=await apiGet('/api/account');
    updateAccountBar();return currentAccount;
  }catch(err){setToken(null);currentAccount=null;updateAccountBar();return null;}
}
async function setAccountTitle(titleId){
  if(!currentAccount)return;
  await apiPost('/api/account/title',{titleId});
  currentAccount.title=titleId;updateAccountBar();
}
function offlineKey(){return 'lg_offline_'+getToken();}
function saveOfflineResult(result){
  const key=offlineKey();if(!key)return;
  const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.push(result);localStorage.setItem(key,JSON.stringify(arr));
}
function getOfflineResults(){
  const key=offlineKey();if(!key)return[];
  return JSON.parse(localStorage.getItem(key)||'[]');
}
function clearOfflineResults(){
  const key=offlineKey();if(!key)return;localStorage.removeItem(key);
}
async function syncOfflineResults(){
  const results=getOfflineResults();if(!results.length||!currentAccount)return;
  for(const r of results){try{await submitGameResult(r,true);}catch(e){return;}}
  clearOfflineResults();
}
async function submitGameResult(result,isSync){
  if(!currentAccount)return null;
  try{
    const data=await apiPost('/api/game/end',result);
    if(!isSync){
      currentAccount.score=data.newScore;
      currentAccount.stats=data.stats;
      currentAccount.achievements=data.newAchievements.map(a=>a.id);
      for(const t of data.newTitles)if(!currentAccount.titles.includes(t.id))currentAccount.titles.push(t.id);
      updateAccountBar();showAccountRewards(data);
    }
    return data;
  }catch(err){
    if(!isSync)saveOfflineResult(result);
    return null;
  }
}
function showAccountRewards(data){
  let msg='';
  if(data.scoreChange>0)msg+=`积分 +${data.scoreChange} · `;
  else if(data.scoreChange<0)msg+=`积分 ${data.scoreChange} · `;
  msg+=`当前 ${data.newScore}`;
  if(data.newAchievements.length)msg+=`\n解锁成就：${data.newAchievements.map(a=>a.name).join('、')}`;
  if(data.newTitles.length)msg+=`\n解锁头衔：${data.newTitles.map(t=>t.name).join('、')}`;
  showMessage(msg);
}
function titleById(id){return TITLES.find(t=>t.id===id)||TITLES[0];}
function formatTitle(account){
  const id=account&&account.title?account.title:'rookie';
  const t=titleById(id);return `<span style="color:${t.color}">[${t.name}]</span>`;
}
function updateAccountBar(){
  const disp=document.getElementById('account-display');
  const score=document.getElementById('score-display');
  const menu=document.getElementById('account-menu-bar');
  if(!disp||!score)return;
  if(!currentAccount){
    disp.innerHTML='访客';score.textContent='';
    if(menu)menu.style.display='none';
  }else{
    disp.innerHTML=formatTitle(currentAccount)+' '+currentAccount.username;
    score.textContent='积分 '+currentAccount.score;
    if(menu)menu.style.display='flex';
  }
}
function renderProfile(){
  if(!currentAccount)return;
  const s=currentAccount.stats||{};
  const title=titleById(currentAccount.title||'rookie');
  document.getElementById('profile-name-line').innerHTML=`${formatTitle(currentAccount)} ${currentAccount.username}`;
  document.getElementById('profile-title-line').textContent=title.name;
  document.getElementById('profile-rank').textContent='Lv.'+Math.floor((currentAccount.score||1000)/500)+' 网络安全员';
  document.getElementById('stat-score').textContent=currentAccount.score||0;
  document.getElementById('stat-games').textContent=s.totalGames||0;
  document.getElementById('stat-wins').textContent=s.wins||0;

let game=null,animId=null,selectedCard=null,mouseX=0,mouseY=0;
let particleEffects=[],floatingTexts=[],nextUid=1;
let shakeTimer=0,flashTimer=0;
const canvas=document.getElementById('game');

class Unit{
  constructor(card,team,lane,x){
    this.uid=nextUid++;this.card=card;this.team=team;this.lane=lane;this.x=x;
    this.y=LANES_Y[lane];this.hp=card.hp||1;this.maxHp=this.hp;
    this.atk=card.atk||0;this.atkSpd=card.atkSpd||1;this.atkCd=0;
    this.range=card.range||60;this.speed=card.speed||0;
    this.isFlying=card.type==='flying';this.isBuilding=card.type==='building';
    this.duration=card.duration||0;this.age=0;this.alive=true;
    this.shield=0;this.stealth=card.stealth||false;this.taunt=card.taunt||false;
    this.tauntRange=card.tauntRange||0;this.ramping=card.ramping||false;
    this.rampStacks=0;this.rampTimer=0;this.bonusVs=card.bonusVs||null;
    this.prioLowest=card.prioLowest||false;this.prioCore=card.prioCore||false;this.flyTarget=card.flyTarget||false;
    this.crossLane=card.crossLane||false;this.aoe=card.aoe||false;this.deathDmg=card.deathDmg||0;
    this.spawnCd=card.spawnCd||0;this.spawnTimer=0;this.revealed=false;this.stunned=0;this.target=null;
    this.atkSpdMul=1;
  }
  update(dt){
    if(!this.alive)return;
    this.age+=dt;this.atkCd=Math.max(0,this.atkCd-dt);this.stunned=Math.max(0,this.stunned-dt);
    if(this.ramping&&this.target){this.rampTimer+=dt;if(this.rampTimer>=3&&this.rampStacks<3){this.rampStacks++;this.rampTimer=0;this.atk=(this.card.atk||60)+this.rampStacks*15;}}
    if(this.duration>0&&this.age>=this.duration){this.die();return;}
    if(this.spawnCd>0){this.spawnTimer+=dt;if(this.spawnTimer>=this.spawnCd){this.spawnTimer-=this.spawnCd;this.spawnMinion();}}
    if(this.stunned>0)return;
    this.findTarget();
    if(this.target&&this.inRange(this.target))this.attackTarget(dt);
    else if(this.speed>0)this.move(dt);
  }
  findTarget(){
    const enemies=game.units.filter(u=>u.alive&&u.team!==this.team&&(u.lane===this.lane||this.crossLane));
    if(this.prioCore){
      const tt=this.getTowerTargets();
      const cores=tt.filter(t=>t.isCore).sort((a,b)=>Math.abs(a.x-this.x)-Math.abs(b.x-this.x));
      if(cores.length>0){this.target=cores[0];return;}
      if(tt.length>0){this.target=tt[0];return;}
    }
    if(this.flyTarget&&!this.isFlying){
      const tt=this.getTowerTargets();if(tt.length>0){this.target=tt[0];return;}
    }
    if(!this.isFlying){
      const taunts=enemies.filter(u=>u.taunt&&u.alive&&Math.abs(u.x-this.x)<u.tauntRange);
      if(taunts.length>0){this.target=taunts[0];return;}
    }
    const reachable=enemies.filter(u=>{
      if(u.lane!==this.lane&&(!this.crossLane||Math.abs(u.x-this.x)>this.range*0.65))return false;
      if(u.isFlying&&!this.flyTarget)return false;
      if(u.stealth&&!u.revealed)return false;
      return true;
    });
    if(this.prioLowest)reachable.sort((a,b)=>a.hp-b.hp);
    else reachable.sort((a,b)=>{
      const laneDiffA=Math.abs(a.lane-this.lane),laneDiffB=Math.abs(b.lane-this.lane);
      if(laneDiffA!==laneDiffB)return laneDiffA-laneDiffB;
      return Math.abs(a.x-this.x)-Math.abs(b.x-this.x);
    });
    this.target=reachable.length>0?reachable[0]:null;
    if(!this.target){const tt=this.getTowerTargets();this.target=tt.length>0?tt[0]:null;}
  }
  getTowerTargets(){
    const targets=[],dir=this.team==='blue'?1:-1;
    for(let li=0;li<3;li++){
      if(li!==this.lane&&!this.flyTarget&&!this.crossLane)continue;
      const tower=game.towers.find(t=>t.team!==this.team&&t.lane===li&&t.alive);
      if(tower){const dx=tower.x-this.x;if((dir>0&&dx>0)||(dir<0&&dx<0))targets.push(tower);}
      if(!game.towers.find(t=>t.team!==this.team&&t.lane===li&&t.alive)){
        const coreHpArr=this.team==='blue'?game.aiCoreHpPerLane:game.coreHpPerLane;
        const cx=this.team==='blue'?LANE_X1+16:LANE_X0-16;
        if(coreHpArr[li]>0)targets.push({x:cx,y:LANES_Y[li],hp:coreHpArr[li],alive:true,isCore:true,lane:li,team:this.team==='blue'?'red':'blue'});
      }
    }
    return targets;
  }
  inRange(t){
    let tx=t.x,ty=t._y!==undefined?t._y:(t.y||0);
    let laneY=LANES_Y[this.lane];
    if(t.lane!==undefined)laneY=LANES_Y[t.lane];
    return Math.abs(this.x-tx)<this.range&&Math.abs(laneY-ty)<50;
  }
  move(dt){const d=this.team==='blue'?1:-1;this.x+=this.speed*d*dt;this.x=Math.max(LANE_X0,Math.min(LANE_X1,this.x));}
  attackTarget(dt){
    if(this.atkCd>0||this.atk<=0)return;this.atkCd=(this.atkSpd/this.atkSpdMul);
    let dmg=this.atk*(this.atkSpd>0?this.atkSpd:1);
    if(this.bonusVs){
      if(this.target.card&&this.target.card.id===this.bonusVs)dmg*=2;
      if(this.bonusVs==='db_tower'&&this.target.isTower&&this.target.lane===2)dmg*=2;
      if(this.bonusVs==='lowest_hp'&&this.target.hp/this.target.maxHp<0.4)dmg*=2;
    }
    if(this.target.isCore){
      const coreArr=this.team==='blue'?game.aiCoreHpPerLane:game.coreHpPerLane;
      coreArr[this.target.lane]-=dmg;
      if(coreArr[this.target.lane]<0)coreArr[this.target.lane]=0;
      spawnFloatingText(this.target.x,this.target.y,Math.round(dmg),this.team);
    }
    else if(this.target.isTower){this.target.hp-=dmg;spawnFloatingText(this.target.x,this.target._y,Math.round(dmg),this.team);if(this.target.hp<=0)this.target.alive=false;}
    else{this.target.hp-=dmg;spawnFloatingText(this.target.x,this.target.y,Math.round(dmg),this.team);if(this.target.hp<=0)this.target.die();}
    if(this.aoe&&this.target&&!this.target.isCore){
      const sDmg=this.atk*0.5*(this.atkSpd>0?this.atkSpd:1);
      game.units.forEach(u=>{
        const sameLaneOrCross=u.lane===this.lane||this.crossLane;
        if(u!==this.target&&u.alive&&u.team!==this.team&&sameLaneOrCross&&Math.abs(u.x-this.target.x)<100){u.hp-=sDmg;if(u.hp<=0)u.die();}
      });
      game.units.forEach(u=>{if(u.stealth&&u.team!==this.team&&(u.lane===this.lane||this.crossLane)&&Math.abs(u.x-this.x)<this.range)u.revealed=true;});
    }
  }
  spawnMinion(){
    const mc={id:'minion',name:'后门小兵',type:'ground',hp:200,atk:70,atkSpd:0.5,range:55,speed:110};
    game.units.push(new Unit(mc,this.team,this.lane,this.x+(this.team==='blue'?20:-20)));
  }
  die(){
    this.alive=false;
    spawnCodeShards(this);
    spawnParticles(this.x,this.y,this.isFlying?'#e0c040':this.team==='blue'?'#3c8cf5':'#f04040',10);
    if(this.deathDmg>0){game.units.forEach(u=>{if(u.alive&&u.team!==this.team&&u.lane===this.lane&&Math.abs(u.x-this.x)<100){u.hp-=this.deathDmg;if(u.hp<=0)u.die();}});spawnParticles(this.x,this.y,'#f0a030',20);}
  }
}

      {team:'blue',lane:1,x:BLUE_TOWER_X,_y:LANES_Y[1],hp:TOWER_HP,maxHp:TOWER_HP,alive:true,isTower:true,shield:0,atkCd:0,atkSpdMul:1},
      {team:'blue',lane:2,x:BLUE_TOWER_X,_y:LANES_Y[2],hp:TOWER_HP,maxHp:TOWER_HP,alive:true,isTower:true,shield:0,atkCd:0,atkSpdMul:1},
      {team:'red',lane:0,x:RED_TOWER_X,_y:LANES_Y[0],hp:TOWER_HP,maxHp:TOWER_HP,alive:true,isTower:true,shield:0,atkCd:0,atkSpdMul:1},
      {team:'red',lane:1,x:RED_TOWER_X,_y:LANES_Y[1],hp:TOWER_HP,maxHp:TOWER_HP,alive:true,isTower:true,shield:0,atkCd:0,atkSpdMul:1},
      {team:'red',lane:2,x:RED_TOWER_X,_y:LANES_Y[2],hp:TOWER_HP,maxHp:TOWER_HP,alive:true,isTower:true,shield:0,atkCd:0,atkSpdMul:1},
    ],units:[],time:0,aiTimer:0,aiNext:2.5,
    aiNextCard:null,aiNextLane:0,aiNextX:DEPLOY_ZONE_RED,
    playerDeck:[... (isAttack?RED_CARDS:BLUE_CARDS)],playerHand:[],handSize:5,
    aiDeck:[... (isAttack?BLUE_CARDS:RED_CARDS)],
    gameOver:false,winner:null,defeatMsg:'',revealTimer:0,
    drawCooldown:0,mfaTimer:0,trainingTimer:0,waterholeTimer:0,emergencyUsed:false
  };
}
function drawHand(g,forceOne){
  if(g.drawCooldown>0&&!forceOne)return;
  if(g.playerHand.length>=g.handSize||g.playerDeck.length===0)return;
  const i=Math.floor(Math.random()*g.playerDeck.length);
  g.playerHand.push(g.playerDeck.splice(i,1)[0]);
  g.drawCooldown=DRAW_INTERVAL;
  ensurePlayableHand(g);
}
function ensurePlayableHand(g){
  if(!g||g.playerHand.length===0||g.playerDeck.length===0)return;
  const affordable=g.playerHand.some(c=>c.cost<=g.power);
  if(affordable)return;
  const cheaperInDeck=g.playerDeck.filter(c=>c.cost<Math.max(...g.playerHand.map(h=>h.cost)));
  if(cheaperInDeck.length===0)return;
  const mostExpensiveIdx=g.playerHand.map((c,i)=>({c,i})).sort((a,b)=>b.c.cost-a.c.cost)[0].i;
  const cheaper=cheaperInDeck.sort((a,b)=>a.cost-b.cost)[0];
  const deckIdx=g.playerDeck.findIndex(c=>c===cheaper);
  if(deckIdx<0)return;
  g.playerDeck.push(g.playerHand.splice(mostExpensiveIdx,1)[0]);
  g.playerHand.push(g.playerDeck.splice(deckIdx,1)[0]);
}
function startGame(team){
  playerTeam=team||'blue';
  document.getElementById('overlay').style.display='none';
  game=createGame();
  // initial fill: draw up to handSize ignoring cooldown
  while(game.playerHand.length<game.handSize&&game.playerDeck.length>0){
    const i=Math.floor(Math.random()*game.playerDeck.length);
    game.playerHand.push(game.playerDeck.splice(i,1)[0]);
  }
  ensurePlayableHand(game);
  game.drawCooldown=DRAW_INTERVAL;
  selectedCard=null;
  rebuildCardHand();updateTip();if(animId)cancelAnimationFrame(animId);loop(performance.now());
}
function startTutorial(dayIndex){
  dayIndex=dayIndex||0;
  tutorialDay=dayIndex;
  const step=TUTORIAL_STEPS[dayIndex];
  playerTeam=step.team;
  document.getElementById('overlay').style.display='none';
  game=createGame();
  game.power=Math.min(MAX_POWER,game.power+(step.powerBonus||0));
  while(game.playerHand.length<game.handSize&&game.playerDeck.length>0){
    const i=Math.floor(Math.random()*game.playerDeck.length);
    game.playerHand.push(game.playerDeck.splice(i,1)[0]);
  }
  ensurePlayableHand(game);
  game.drawCooldown=DRAW_INTERVAL;
  game.aiTimer=step.aiDelay;
  selectedCard=null;
  tutorialMessage=`${step.title}：${step.desc}`;
  tutorialTimer=4.0;
  showMessage(tutorialMessage);
  rebuildCardHand();updateTip();if(animId)cancelAnimationFrame(animId);loop(performance.now());
}
function nextTutorialDayOrMenu(){
  if(tutorialDay>=0&&tutorialDay+1<TUTORIAL_STEPS.length){
    startTutorial(tutorialDay+1);
  }else{
    tutorialDay=-1;

  }
}

// ── Card Hand DOM ──
const CARD_COLORS={
  firewall:'#3c8cf5',waf:'#5ca8f0',ids:'#50e890',edr:'#4088e0',honeypot:'#e0b040',patch:'#60d080',emergency:'#f06040',encrypt:'#70c0f0',threat_hunter:'#20d0a0',mfa:'#40c0a0',training:'#50a0f0',blockade:'#30a0e0',
  scan:'#f08040',phish:'#e0c040',sql_inject:'#e04040',bruteforce:'#f06030',zeroday:'#c030c0',ddos:'#a03030',ransomware:'#d02020',backdoor:'#9040d0',waterhole:'#b06020',nday:'#d04080',minion:'#a040d0'
};
function rebuildCardHand(){
  const ctr=document.getElementById('card-hand');ctr.innerHTML='';
  if(!game||game.gameOver)return;
  game.playerHand.forEach((card,i)=>{
    const accent=CARD_COLORS[card.id]||'#3cf58b';
    const tagText=card.type==='flying'?'飞行':card.type==='spell'?'法术':card.type==='building'?'建筑':'地面';
    const tagClass=card.type;
    let statsHtml='';
    if(card.hp)statsHtml+=`<span class="card-stat">HP<span class="card-stat-val">${card.hp}</span></span>`;
    if(card.atk)statsHtml+=`<span class="card-stat">ATK<span class="card-stat-val">${card.atk}${card.atkSpd?'/s':''}</span></span>`;
    if(card.duration)statsHtml+=`<span class="card-stat">⏱<span class="card-stat-val">${card.duration}s</span></span>`;
    const d=document.createElement('div');d.className='card';d.dataset.idx=i;
    d.style.setProperty('--card-accent',accent);
    if(game.power<card.cost||card.spell==='killAll'&&game.emergencyUsed)d.classList.add('unaffordable');
    if(card.spell==='killAll'&&game.emergencyUsed)d.classList.add('used-up');
    if(selectedCard===card)d.classList.add('selected');
    d.innerHTML=
      `<div class="card-rarity-glow"></div>`+
      `<div class="card-inner">`+
        `<div class="card-pixel"><canvas id="pc-${i}" width="16" height="42"></canvas></div>`+
        `<div class="card-header"><span class="card-name">${card.name}</span></div>`+
        `<div class="card-body">`+
          `<span class="card-desc">${card.desc}</span>`+
          (statsHtml?`<div class="card-stats">${statsHtml}</div>`:'')+
        `</div>`+
        `<div class="card-footer">`+
          `<span class="card-tag ${tagClass}">${tagText}</span>`+
        `</div>`+
      `</div>`+
      `<div class="card-cost-orb">${card.cost}</div>`;
    d.addEventListener('click', e => { e.stopPropagation(); onCardClick(card); });
    d.addEventListener('mouseenter', e => showTooltip(e, card));
    d.addEventListener('mouseleave', hideTooltip);
    d.draggable = true;
    d.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', i); e.dataTransfer.effectAllowed = 'copy'; onCardClick(card); });
    ctr.appendChild(d);
    drawCardPixel(`pc-${i}`, card, accent);
  });
}
function drawCardPixel(canvasId,card,accent){
  const cvs=document.getElementById(canvasId);if(!cvs)return;
  const ctx=cvs.getContext('2d');ctx.clearRect(0,0,16,42);
  ctx.fillStyle='#07120c';ctx.fillRect(0,0,16,42);
  const col=accent;
  ctx.fillStyle=col;
  if(card.type==='ground'){
    // pixel soldier: head 4x4, body 8x6, legs
    ctx.fillRect(6,4,4,4); ctx.fillRect(4,9,8,6); ctx.fillRect(4,16,3,8); ctx.fillRect(9,16,3,8);
    // gun
    ctx.fillStyle='#fff';ctx.fillRect(10,11,5,2);
  }else if(card.type==='flying'){
    // pixel drone
    ctx.fillRect(5,6,6,3); ctx.fillRect(3,9,10,4); ctx.fillRect(1,11,14,2);
    ctx.fillStyle='#fff';ctx.fillRect(7,10,2,2);
  }else if(card.type==='building'){
    // pixel tower
    ctx.fillRect(6,4,4,4); ctx.fillRect(4,8,8,16); ctx.fillRect(2,24,12,10);
    ctx.fillStyle='#fff';ctx.fillRect(7,12,2,4);
  }else{
    // spell orb
    ctx.beginPath();ctx.arc(8,14,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(6,12,4,4);
    ctx.fillStyle=col;ctx.fillRect(5,24,6,2);ctx.fillRect(7,22,2,6);
  }
  // ground line
  ctx.fillStyle='#1a2e20';ctx.fillRect(0,38,16,4);
}
function refreshCardVisuals(){
  if(!game||game.gameOver)return;
  document.querySelectorAll('#card-hand .card').forEach(d=>{
    const i=parseInt(d.dataset.idx),card=game.playerHand[i];
    if(!card)return;
    d.classList.toggle('unaffordable',game.power<card.cost);
    d.classList.toggle('selected',selectedCard===card);
  });
}
function onCardClick(card){
  if(game.power<card.cost)return;
  selectedCard=selectedCard===card?null:card;
  updateTip();
  refreshCardVisuals();
}
function getCardKeywordHint(c){
  if(c.spell==='mfa')return '锁定敌方部署';
  if(c.spell==='training')return '塔攻速翻倍';
  if(c.spell==='waterhole')return '减速敌方塔';
  if(c.spell==='killAll')return '全图清场';
  if(c.spell==='directDmg')return '无视护盾';
  if(c.bonusVs==='sql_inject')return '反SQL注入';
  if(c.flyTarget)return '可对空/揭示隐身';
  if(c.isFlying||c.type==='flying')return '飞行·越地面';
  if(c.taunt)return '嘲讽改道';
  if(c.stealth)return '隐匿';

}
function updateTip(){
  const el=document.getElementById('tip-text');

  if(selectedCard){

    el.textContent=`已选"${c.name}"· ${place}${kw?' · '+kw:''}`;

function showTooltip(e,card){
  const t=document.getElementById('tooltip');
  const accent=CARD_COLORS[card.id]||'#3cf58b';
  t.style.setProperty('--card-accent',accent);
  const typeLabel=card.type==='flying'?'飞行·无视地面阻挡':card.type==='building'?(card.duration?'限时'+card.duration+'秒建筑':'永久建筑'):card.type==='spell'?'瞬发法术':'沿路前进自动交战';
  let stats=[];
  if(card.hp)stats.push(`HP ${card.hp}`);
  if(card.atk)stats.push(`ATK ${card.atk}${card.atkSpd?'/s':''}`);
  if(card.duration)stats.push(`持续 ${card.duration}s`);
  const statsLine=stats.length?`<div style="margin-top:6px;color:#7eb896;font-size:10px;letter-spacing:0.5px;">${stats.join(' · ')}</div>`:'';
  t.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${accent};box-shadow:0 0 8px ${accent};"></span><b>${card.name}</b><span style="color:${accent};margin-left:auto;font-weight:bold;">${card.cost} 算力</span></div><div style="color:#8ab89a;line-height:1.5;">${card.desc}</div>${statsLine}<div style="margin-top:6px;color:#5a8a6a;font-size:10px;">${typeLabel}</div>`;
  t.style.display='block';t.style.left=Math.min(e.clientX+16,window.innerWidth-280)+'px';t.style.top=(e.clientY-120)+'px';
}
function hideTooltip(){document.getElementById('tooltip').style.display='none';}

function getCanvasXY(e){
  const rect=canvas.getBoundingClientRect();
  const clientX=e.touches?.[0]?.clientX??e.changedTouches?.[0]?.clientX??e.clientX;
  const clientY=e.touches?.[0]?.clientY??e.changedTouches?.[0]?.clientY??e.clientY;
  return{
    x:(clientX-rect.left)*(CANVAS_W/rect.width),
    y:(clientY-rect.top)*(CANVAS_H/rect.height)
  };
}
function tryDeployAt(canvasX, canvasY) {
  if (!game || game.gameOver || !selectedCard) return;
  const team = playerTeam;
  if (game.mfaTimer > 0 && game.mfaTeam === team) { showMessage('双因子验证锁定中 · 无法部署'); return; }
  const slot = game.playerHand.indexOf(selectedCard);
  if (slot < 0 || game.power < selectedCard.cost) return;
  let lane = -1;
  for (let i = 0; i < 3; i++) {
    if (canvasY >= LANES_Y[i] - LANE_H / 2 && canvasY <= LANES_Y[i] + LANE_H / 2) { lane = i; break; }
  }
  if (lane < 0) return;
  const card = game.playerHand[slot];
  let dx;
  if (team === 'blue') dx = Math.max(DEPLOY_ZONE_BLUE - 160, Math.min(DEPLOY_ZONE_BLUE, canvasX));
  else dx = Math.max(DEPLOY_ZONE_RED, Math.min(DEPLOY_ZONE_RED + 160, canvasX));
  if (card.type === 'spell') castSpell(card, team, lane, dx, canvasY);
  else game.units.push(new Unit(card, team, lane, dx));
  game.power -= card.cost;
  game.playerHand.splice(slot, 1); game.playerDeck.push(card);
  selectedCard = null; drawHand(game,true); rebuildCardHand(); updateTip();
}

canvas.addEventListener('mousemove', e => {

function castSpell(card,team,lane,x,y){
  if(card.spell==='killAll'&&game.emergencyUsed){showMessage('应急响应已耗尽');return;}
  switch(card.spell){
    case'heal':{
      let best=null,bd=Infinity;
      game.towers.filter(t=>t.team===team&&t.alive).forEach(t=>{const d=Math.hypot(t.x-x,t._y-y);if(d<bd){bd=d;best=t;}});
      game.units.filter(u=>u.team===team&&u.isBuilding&&u.alive).forEach(u=>{const d=Math.hypot(u.x-x,u.y-y);if(d<bd){bd=d;best=u;}});
      if(best&&bd<200){const h=card.healPct*(best.maxHp||best.hp*2.5);best.hp=Math.min((best.maxHp||best.hp*2.5),best.hp+h);spawnFloatingText(best.x,best._y||best.y,'+'+Math.round(h),'blue');spawnParticles(best.x,best._y||best.y,'#60d080',15);}
      break;}
    case'killAll':game.emergencyUsed=true;game.units.filter(u=>u.team!==team&&u.alive).forEach(u=>u.die());spawnParticles(CANVAS_W/2,CANVAS_H/2,'#ffffff',40);showMessage('应急响应启动 · 全图清场');break;
    case'shield':{
      let tgt=null,td=Infinity;
      game.towers.filter(t=>t.team===team&&t.alive).forEach(t=>{const d=Math.hypot(t.x-x,t._y-y);if(d<td){td=d;tgt=t;}});
      if(tgt&&td<200){tgt.shield=(tgt.shield||0)+card.shieldAmt;spawnFloatingText(tgt.x,tgt._y,'盾+'+card.shieldAmt,'blue');}break;}
    case'reveal':game.revealTimer=card.revealTime;game.units.filter(u=>u.team!==team).forEach(u=>u.revealed=true);break;
    case'directDmg':{
      let v=null,vd=Infinity;
      game.towers.filter(t=>t.team!==team&&t.alive).forEach(t=>{const d=Math.hypot(t.x-x,t._y-y);if(d<vd){vd=d;v=t;}});
      if(v&&vd<200){v.hp-=card.dmg;spawnFloatingText(v.x,v._y,card.dmg,'red');spawnParticles(v.x,v._y,'#c030c0',20);if(v.hp<=0)v.alive=false;}break;}
    case'aoeStun':
      game.units.filter(u=>u.team!==team&&u.alive&&u.lane===lane).forEach(u=>{u.hp-=card.dmg;u.stunned=Math.max(u.stunned,card.stun);if(u.hp<=0)u.die();});
      game.towers.filter(t=>t.team!==team&&t.alive&&t.lane===lane).forEach(t=>{t.hp-=card.dmg;if(t.hp<=0)t.alive=false;});
      spawnParticles(x,y,'#a03030',25);break;
    case'mfa':{
      const enemyTeam=team==='blue'?'red':'blue';
      game.mfaTimer=card.mfaTime;game.mfaTeam=enemyTeam;
      showMessage('双因子验证启动 · 敌方部署锁定 '+card.mfaTime+'秒');spawnParticles(CANVAS_W/2,CANVAS_H/2,'#40c0a0',30);break;}
    case'training':{
      game.trainingTimer=card.trainTime;
      game.towers.filter(t=>t.team===team&&t.alive).forEach(t=>t.atkSpdMul=2);
      game.units.filter(u=>u.team===team&&u.alive&&u.isBuilding).forEach(u=>u.atkSpdMul=2);
      showMessage('安全培训 · 塔攻速翻倍 '+card.trainTime+'秒');break;}
    case'waterhole':{
      const enemyTowers=game.towers.filter(t=>t.team!==team&&t.alive);
      if(enemyTowers.length>0){
        const tgt=enemyTowers.sort((a,b)=>Math.abs(a.x-x)-Math.abs(b.x-x))[0];
        game.waterholeTarget=tgt;game.waterholeTimer=card.whTime;game.waterholeTeam=tgt.team;
        tgt.atkSpdMul=0.5;showMessage('水坑攻击 · 敌方塔攻速减半 '+card.whTime+'秒');
      }break;}
    case'blockade':{
      const nearestLane=LANES_Y.map((yy,i)=>({i,d:Math.abs(yy-y)})).sort((a,b)=>a.d-b.d)[0].i;
      const enemyTeam=team==='blue'?'red':'blue';
      let hits=0;
      game.units.filter(u=>u.team===enemyTeam&&u.alive&&u.lane===nearestLane).forEach(u=>{
        u.hp-=card.blockDmg;u.stunned=Math.max(u.stunned,card.blockStun);hits++;
        if(u.hp<=0)u.die();
      });
      showMessage('实时封堵 · '+LANE_NAMES[nearestLane]+'冻结 '+card.blockStun+'秒');
      spawnParticles(x,LANES_Y[nearestLane],CARD_COLORS.blockade||'#30a0e0',15+hits*5);
      break;}
  }
}

function updateAiThreatDisplay(g){
  const el=document.getElementById('ai-threat');
  if(tutorialDay>=0){if(el)el.textContent='教学模式 · AI按固定节奏出牌';return;}
  if(!g||!g.aiNextCard){if(el)el.textContent='侦察中…';return;}
  const names=['暴露面','横向移动通道','核心资产区'];
  const lane=names[g.aiNextLane]||'未知';
  const nextIn=Math.max(0,g.aiTimer).toFixed(1);
  if(game.mfaTimer>0&&game.mfaTeam===(playerTeam==='red'?'blue':'red'))el.textContent=`双因子验证锁定中 ${game.mfaTimer.toFixed(1)}s`;
  else if(g.aiPower<g.aiNextCard.cost)el.textContent=`${g.aiNextCard.name}·${lane}·蓄力中 ${nextIn}s`;
  else el.textContent=`下一波：${g.aiNextCard.name} → ${lane} (${nextIn}s)`;
}

let lasers=[];
function spawnLaser(x1,y1,x2,y2,color){lasers.push({x1,y1,x2,y2,color,life:0.15,maxLife:0.15});}
let shards=[];
function spawnCodeShards(u){
  const base=u.card.color||(u.team==='blue'?'#4088e0':'#e04040');
  const chars=['0','1','}',';','/','*','#','[',']','{','<','>','?'];
  for(let i=0;i<16;i++){
    shards.push({
      x:u.x+(Math.random()-0.5)*24,
      y:(u.isFlying?u.y-28:u.y)+(Math.random()-0.5)*24,
      color:Math.random()<0.5?base:'#a0c0b0',
      char:chars[Math.floor(Math.random()*chars.length)],
      vx:(Math.random()-0.5)*90,
      vy:(Math.random()-0.8)*90,
      rot:(Math.random()-0.5)*2,
      vRot:(Math.random()-0.5)*4,
      life:0.6+Math.random()*0.5,
      maxLife:0.6+Math.random()*0.5,
      size:8+Math.random()*6
    });
  }
}
function updateShards(dt){
  shards.forEach(s=>{
    s.life-=dt;
    s.x+=s.vx*dt;
    s.y+=s.vy*dt;
    s.vy+=120*dt;
    s.rot+=s.vRot*dt;
  });
  shards=shards.filter(s=>s.life>0);
}
function renderShards(ctx){
  ctx.save();
  shards.forEach(s=>{
    const a=s.life/s.maxLife;
    ctx.globalAlpha=a;
    ctx.fillStyle=s.color;
    ctx.font=`bold ${Math.round(s.size*1.15)}px "Share Tech Mono",monospace`;
    ctx.textAlign='center';
    ctx.translate(s.x,s.y);
    ctx.rotate(s.rot);
    ctx.fillText(s.char,0,0);
    ctx.rotate(-s.rot);
    ctx.translate(-s.x,-s.y);
  });
  ctx.restore();
}
function spawnParticles(x,y,color,count){for(let i=0;i<count;i++)particleEffects.push({x,y,color,vx:(Math.random()-0.5)*120,vy:(Math.random()-0.5)*120,life:0.5+Math.random()*0.7,maxLife:0.5+Math.random()*0.7,size:1+Math.random()*3});}
function spawnFloatingText(x,y,text,team){floatingTexts.push({x,y,text:String(text),color:team==='blue'?'#5cb8ff':'#f05050',life:1.2,maxLife:1.2,vy:-40});}
function showMessage(msg){const el=document.getElementById('message');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2200);}

// ── AI ──
function aiTick(g, dt) {
  // deprecated; logic split into planAiNextMove + executeAiNextMove
}

function planAiNextMove(g) {
  const affordable = g.aiDeck.filter(c => g.aiPower >= c.cost && !(c.spell==='killAll' && g.emergencyUsed));
  if (!affordable.length) { g.aiNextCard = null; return; }
  const card = affordable[Math.floor(Math.random() * affordable.length)];
  const aiTeam = playerTeam === 'red' ? 'blue' : 'red';
  const targetTeam = aiTeam === 'red' ? 'blue' : 'red';
  const ls = [0, 1, 2].map(li => {
    let s = 1;
    const t = g.towers.find(t => t.team === targetTeam && t.lane === li);
    if (t && t.alive) s += (1 - t.hp / t.maxHp) * 3;
    s += g.units.filter(u => u.team === targetTeam && u.alive && u.lane === li).length * 0.5;
    const cores = targetTeam === 'blue' ? g.coreHpPerLane : g.aiCoreHpPerLane;
    if (cores[li] < CORE_HP * 0.35) s += 2;
    return s;
  });
  const ts = ls.reduce((a, b) => a + b, 0);
  let r = Math.random() * ts, lane = 0;
  for (let i = 0; i < 3; i++) { r -= ls[i]; if (r <= 0) { lane = i; break; } }
  g.aiNextCard = card;
  g.aiNextLane = lane;
  g.aiNextX = aiTeam === 'red' ? DEPLOY_ZONE_RED + Math.random() * 80 : DEPLOY_ZONE_BLUE - 160 + Math.random() * 80;
}

function executeAiNextMove(g) {
  if (!g.aiNextCard) return;
  const card = g.aiNextCard;
  const aiTeam = playerTeam === 'red' ? 'blue' : 'red';
  if (game.mfaTimer > 0 && game.mfaTeam === aiTeam) return; // locked by MFA
  if (card.type === 'spell') castSpell(card, aiTeam, g.aiNextLane, g.aiNextX, LANES_Y[g.aiNextLane]);
  else game.units.push(new Unit(card, aiTeam, g.aiNextLane, g.aiNextX));
  g.aiPower -= card.cost;
}

// ── Loop ──
function loop(now){
  if(!game||game.gameOver){animId=requestAnimationFrame(loop);return;}
  const dt=Math.min(0.1,(now-(game._last||now))/1000);game._last=now;
  game.time+=dt;
  const regen=game.time>=FAST_REGEN_TIME?POWER_REGEN_FAST:POWER_REGEN;
  game.power=Math.min(MAX_POWER,game.power+regen*dt);
  game.aiPower=Math.min(MAX_POWER,game.aiPower+regen*dt);
  if(selectedCard){
    const myPower=playerTeam==='blue'?game.power:game.aiPower;
    const enemyPower=playerTeam==='blue'?game.aiPower:game.power;
    const cost=selectedCard.cost;
    if(myPower>=cost&&myPower-cost>=enemyPower){
      showMessage('算力领先！可安全出牌');
    }
  }
  if(game.revealTimer>0){game.revealTimer-=dt;if(game.revealTimer<=0)game.units.forEach(u=>u.revealed=false);}
  if(game.mfaTimer>0){game.mfaTimer-=dt;}
  if(game.trainingTimer>0){game.trainingTimer-=dt;if(game.trainingTimer<=0){game.towers.filter(t=>t.alive).forEach(t=>t.atkSpdMul=1);game.units.filter(u=>u.alive).forEach(u=>u.atkSpdMul=1);}}
  if(game.waterholeTimer>0){game.waterholeTimer-=dt;if(game.waterholeTimer<=0){if(game.waterholeTarget&&game.waterholeTarget.alive)game.waterholeTarget.atkSpdMul=1;}}
  if(game.drawCooldown>0)game.drawCooldown-=dt;
  drawHand(game);
  // IDS reveal: any friendly IDS reveals enemy stealth units in range
  game.units.filter(u=>u.alive&&u.card.flyTarget).forEach(ids=>{
    game.units.filter(e=>e.team!==ids.team&&e.stealth&&e.alive&&e.lane===ids.lane&&Math.abs(e.x-ids.x)<ids.range).forEach(e=>e.revealed=true);
  });
  game.units.forEach(u=>u.update(dt));game.units=game.units.filter(u=>u.alive);
  particleEffects.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;});particleEffects=particleEffects.filter(p=>p.life>0);
  floatingTexts.forEach(t=>{t.life-=dt;t.y+=t.vy*dt;});floatingTexts=floatingTexts.filter(t=>t.life>0);
  updateShards(dt);
  lasers.forEach(l=>{l.life-=dt;});lasers=lasers.filter(l=>l.life>0);
  // Tower attacks
  game.towers.forEach(t=>{
    if(!t.alive)return;
    t.atkCd=Math.max(0,t.atkCd-dt);
    if(t.atkCd<=0){
      const enemies=game.units.filter(u=>u.alive&&u.team!==t.team&&u.lane===t.lane&&Math.abs(u.x-t.x)<TOWER_RANGE);
      if(enemies.length>0){
        const target=enemies.sort((a,b)=>Math.abs(a.x-t.x)-Math.abs(b.x-t.x))[0];
        const towerAtk=getTowerAtk();
        target.hp-=towerAtk;
        spawnFloatingText(target.x,target.y,towerAtk,t.team);
        spawnLaser(t.x,t._y,target.x,target.y,t.team==='blue'?'#60a0ff':'#ff6060');
        if(target.hp<=0)target.die();
        t.atkCd=t.atkSpdMul>0?TOWER_ATK_SPD/t.atkSpdMul:TOWER_ATK_SPD;
      }
    }
  });
  game.towers.forEach(t=>{
    if(t.alive&&t.hp<=0){
      t.alive=false;
      spawnParticles(t.x,t._y,t.team==='blue'?'#2050d0':'#d03030',25);
      showMessage(`${LANE_NAMES[t.lane]}${t.team==='blue'?'蓝方':'红方'}节点塔被摧毁！`);
      shakeTimer=0.35;
      flashTimer=0.25;
    }
  });
  // AI preview: always know next move
  if(!game.aiNextCard)planAiNextMove(game);
  let aiDelay=2.0+Math.random()*2.0;
  if(tutorialDay>=0)aiDelay=TUTORIAL_STEPS[tutorialDay].aiDelay;
  game.aiTimer-=dt;
  if(game.aiTimer<=0){executeAiNextMove(game);planAiNextMove(game);game.aiTimer=aiDelay;}
  if(tutorialDay>=0){
    tutorialTimer=Math.max(0,tutorialTimer-dt);
    if(tutorialTimer<=0){tutorialTimer=9999;document.getElementById('tip-text').textContent=`教学：${TUTORIAL_STEPS[tutorialDay].desc}`;}
  }
  const totalCore=game.coreHpPerLane.reduce((a,b)=>a+b,0);
  const totalAiCore=game.aiCoreHpPerLane.reduce((a,b)=>a+b,0);
  const playerLost=playerTeam==='blue'?totalCore<=0:totalAiCore<=0;
  const playerWon=playerTeam==='blue'?totalAiCore<=0:totalCore<=0;
  if(playerLost){endGame(playerTeam==='blue'?'red':'blue',playerTeam==='blue'?'核心服务器被攻破——域控权限丢失。\n"你的轮班结束了。"':'红队攻击链被切断——任务失败。\n"对方守住了光速城。"');return;}
  if(playerWon){endGame(playerTeam==='blue'?'blue':'red',playerTeam==='blue'?'对方核心服务器已下线——攻击链断裂。\n"光速城今夜平安。"':'对方核心服务器已攻破——域控权限到手。\n"光速城今夜失守。"');return;}
  // Time limit
  if(game.time>=GAME_TIME_LIMIT){
    const playerCoreTotal=playerTeam==='blue'?totalCore:totalAiCore;
    const aiCoreTotal=playerTeam==='blue'?totalAiCore:totalCore;
    if(playerCoreTotal>aiCoreTotal){endGame(playerTeam,playerTeam==='blue'?'时间到！核心血量领先，光速城守住。':'时间到！核心血量领先，任务成功。');return;}
    else if(aiCoreTotal>playerCoreTotal){endGame(playerTeam==='blue'?'red':'blue',playerTeam==='blue'?'时间到！核心血量落后，域控权限丢失。':'时间到！核心血量落后，攻击失败。');return;}
    else{endGame('draw','时间到！双方核心血量相同，平局。');return;}
  }
  // ── HUD ──
  document.getElementById('power-display').textContent=Math.floor(game.power)+'/'+MAX_POWER;
  document.getElementById('ai-power-display').textContent=Math.floor(game.aiPower)+'/'+MAX_POWER;
  document.getElementById('power-bar').style.width=(game.power/MAX_POWER*100)+'%';
  document.getElementById('ai-power-bar').style.width=(game.aiPower/MAX_POWER*100)+'%';
  const playerCores=playerTeam==='blue'?game.coreHpPerLane:game.aiCoreHpPerLane;
  const aiCores=playerTeam==='blue'?game.aiCoreHpPerLane:game.coreHpPerLane;
  document.getElementById('core-display').textContent=Math.max(0,Math.round(playerCores.reduce((a,b)=>a+b,0)));
  document.getElementById('ai-core-display').textContent=Math.max(0,Math.round(aiCores.reduce((a,b)=>a+b,0)));
  for(let i=0;i<3;i++){
    const bar=document.getElementById('core-bar-'+i);
    const aiBar=document.getElementById('ai-core-bar-'+i);
    bar.style.width=Math.max(0,(playerCores[i]/CORE_HP*100))+'%';
    aiBar.style.width=Math.max(0,(aiCores[i]/CORE_HP*100))+'%';
    bar.classList.toggle('danger',playerCores[i]<=CORE_HP*0.35);
    aiBar.classList.toggle('danger',aiCores[i]<=CORE_HP*0.35);
  }
  const m=Math.floor(game.time/60),s=Math.floor(game.time%60);
  const timeLeft=Math.max(0,GAME_TIME_LIMIT-game.time);
  const ml=Math.floor(timeLeft/60),sl=Math.floor(timeLeft%60);
  document.getElementById('time-display').textContent=String(ml).padStart(2,'0')+':'+String(sl).padStart(2,'0');
  if(timeLeft<=30)document.getElementById('time-display').classList.add('danger');
  else document.getElementById('time-display').classList.remove('danger');
  const playerCoreTotal=Math.round(playerCores.reduce((a,b)=>a+b,0));
  const ce=document.getElementById('core-display');if(playerCoreTotal<CORE_HP*0.75)ce.classList.add('danger');else ce.classList.remove('danger');
  updateAiThreatDisplay(game);
  render(game);refreshCardVisuals();
  animId=requestAnimationFrame(loop);
}
function endGame(winner,msg){
  game.gameOver=true;game.winner=winner;game.defeatMsg=msg;
  const ov=document.getElementById('overlay');ov.style.display='flex';
  const playerWon=winner===playerTeam;
  const titleColor=winner==='draw'?'#f0c030':(playerWon?'#3cf58b':'#f53c3c');
  const titleText=winner==='draw'?'平局':(playerWon?'任务完成':'任务失败');
  const advice=generateEndGameAdvice(winner,playerWon);
  const scoreLine=currentAccount?'<div class="end-score" id="score-result">正在同步积分...</div>':'';
  const buttons=`<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px;"><button id="restart-defend-btn">防守方（蓝队）</button><button id="restart-attack-btn">进攻方（红队）</button></div>`;
  if(tutorialDay>=0){
    const nextLabel=tutorialDay+1<TUTORIAL_STEPS.length?'进入下一天':'完成教学';
    ov.innerHTML=`<div class="end-card"><h2 style="color:${titleColor}">${titleText}</h2><div class="end-msg">${msg}</div><div class="end-advice">${advice}</div>${scoreLine}</div>${buttons}<div style="display:flex;gap:12px;justify-content:center;"><button id="tutorial-next-btn" style="border-color:#3c8cf5;color:#3c8cf5;">${nextLabel}</button></div>`;
    document.getElementById('tutorial-next-btn').addEventListener('click',()=>nextTutorialDayOrMenu());
    if(currentAccount)submitTutorialResult();
  }else{
    ov.innerHTML=`<div class="end-card"><h2 style="color:${titleColor}">${titleText}</h2><div class="end-msg">${msg}</div><div class="end-advice">${advice}</div>${scoreLine}</div>${buttons}`;
    if(currentAccount)submitMatchResult();
  }
  document.getElementById('restart-defend-btn').addEventListener('click',()=>{tutorialDay=-1;startGame('blue');});
  document.getElementById('restart-attack-btn').addEventListener('click',()=>{tutorialDay=-1;startGame('red');});
  updateTip();
}
async function submitMatchResult(){
  const playerCores=playerTeam==='blue'?game.coreHpPerLane:game.aiCoreHpPerLane;
  const aiCores=playerTeam==='blue'?game.aiCoreHpPerLane:game.coreHpPerLane;
  const playerCoreTotal=Math.max(0,Math.round(playerCores.reduce((a,b)=>a+b,0)));
  const aiCoreTotal=Math.max(0,Math.round(aiCores.reduce((a,b)=>a+b,0)));
  const totalKills=game.units.reduce((a,u)=>a+(u.alive?0:1),0);
  const towersDestroyed=game.towers.filter(t=>!t.alive&&t.team!==playerTeam).length;
  const result={
    playerTeam,
    winner:game.winner,
    duration:Math.min(GAME_TIME_LIMIT,Math.max(0,game.time)),
    playerCoreTotal,
    aiCoreTotal,
    totalKills,
    towersDestroyed,
    tutorial:false
  };
  const data=await submitGameResult(result,false);
  const el=document.getElementById('score-result');if(!el)return;
  if(data){
    let html=`积分 <b>${data.scoreChange>0?'+':''}${data.scoreChange}</b> · 当前 <b>${data.newScore}</b>`;
    if(data.newAchievements.length)html+=`<br>解锁成就：${data.newAchievements.map(a=>a.name).join('、')}`;
    if(data.newTitles.length)html+=`<br>解锁头衔：${data.newTitles.map(t=>t.name).join('、')}`;
    el.innerHTML=html;
  }else{
    el.textContent='同步失败，结果已本地缓存，联网后自动同步。';
  }
}
async function submitTutorialResult(){
  const result={playerTeam,winner:game.winner,duration:Math.min(GAME_TIME_LIMIT,Math.max(0,game.time)),playerCoreTotal:0,aiCoreTotal:0,totalKills:0,towersDestroyed:0,tutorial:true};
  await submitGameResult(result,false);
}
function generateEndGameAdvice(winner,playerWon){
  if(winner==='draw')return '双方势均力敌。尝试调整卡组节奏，抓住对手费用空档。';
  const playerCores=playerTeam==='blue'?game.coreHpPerLane:game.aiCoreHpPerLane;
  const aiCores=playerTeam==='blue'?game.aiCoreHpPerLane:game.coreHpPerLane;
  const playerTowers=game.towers.filter(t=>t.team===playerTeam&&t.alive).length;
  const aiTowers=game.towers.filter(t=>t.team!==playerTeam&&t.alive).length;
  const playerCoreTotal=playerCores.reduce((a,b)=>a+b,0);
  const aiCoreTotal=aiCores.reduce((a,b)=>a+b,0);
  const defending=playerTeam==='blue';
  if(playerWon){
    if(aiCoreTotal<=0)return '完胜！核心被彻底摧毁，攻防节奏掌控得当。';
    if(aiTowers===0)return '优秀。拆除了所有节点塔，再部署高费单位扩大优势。';
    return '胜利。保持当前节奏，注意算力领先时果断施压。';
  }
  const tips=[];
  const lostLanes=playerCores.map((hp,i)=>hp<=0?i:-1).filter(i=>i>=0);
  if(lostLanes.length>0)tips.push(`${lostLanes.map(i=>LANE_NAMES[i]).join('、')}核心失守，注意分路均衡防守。`);
  if(defending){
    if(playerTowers<=1)tips.push('节点塔损失严重，提前部署防火墙/WAF建立前线。');
    if(aiCoreTotal>CORE_HP*2.5)tips.push('敌方核心血量健康，尝试用IDS+蜜罐拖延，再反打。');
    else tips.push('局势接近翻盘，抓住下一波算力差发起反击。');
  }else{
    if(aiTowers>=5)tips.push('敌方防守塔完整，优先用钓鱼邮件/零日漏洞绕过正面。');
    if(playerCoreTotal>aiCoreTotal)tips.push('核心血量领先但时间耗尽，下次加快进攻节奏。');
    else tips.push('核心血量落后，避免无效消耗，攒费打一波强力突破。');
  }
  if(tips.length===0)tips.push('复盘战斗，优化出牌时机和 lane 分配。');
  return '诊断：'+tips.join(' ');
}

// ── Render ──
function render(g){
  // Screen shake

  if(shakeTimer>0){
    const intensity=8*shakeTimer/0.35;
    sx=(Math.random()-0.5)*intensity;
    sy=(Math.random()-0.5)*intensity;
  }
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  ctx.fillStyle='#080d0a';ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  ctx.save();ctx.translate(sx,sy);

  // ── Side panels ──
  // Blue side (left)
  const blueGrad=ctx.createLinearGradient(0,0,LANE_X0-20,0);
  blueGrad.addColorStop(0,'rgba(20,60,180,0.08)');blueGrad.addColorStop(1,'rgba(20,60,180,0)');
  ctx.fillStyle=blueGrad;ctx.fillRect(0,0,LANE_X0-20,CANVAS_H);
